{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}

{% block style_css %}
<link rel="stylesheet"
      href="{{url_for('static', filename='css/forgot_pass.css')}}">
{% endblock %}

{% block content %}

<form id="forgot_pass_form" method="POST" action="{{url_for('forgot_pass.forgot_password')}}" >
    <div class="logo">
        <img src="{{ url_for('static', filename='img/logo.jpg')}}">
    </div>
    <h2 align="center"> Account Recovery</h2>
    <p align="center">Please enter your Student ID and registered email to receive a reset code.</p>
    <div class="form-group">
        <label for="student_id">Student ID</label>
        <input type="text"
               class="form-control"
               id="student_id"
               name="student_id"
               placeholder="Enter student ID"
               required>
    </div>
    <div class="form-group">
        <label for="email">Email</label>
        <input type="text"
               class="form-control"
               id="email"
               name="email"
               placeholder="Enter Email"
               required>
    </div>
    <br />
        <button id="enter-button" type="submit" class="btn btn-primary">Enter</button>

</form>
{% endblock %}
