{% extends "base.html" %}
{% block title %}Change Password{% endblock %}

{% block style_css %}
<link rel="stylesheet"
      href="{{url_for('static', filename='css/change_pass.css')}}">
{% endblock %}

{% block content %}

<form id="change_pass_form" method="POST" action="{{url_for('change_pass.change_password')}}" >
    <div class="logo">
        <img src="{{ url_for('static', filename='img/logo.jpg')}}">
    </div>
    <h2 align="center"> Account Recovery</h2>
    <p align="center">Please enter your Student ID and registered email to receive a reset code.</p>
    <div class="form-group">
        <label for="student_id">Student ID</label>
        <input type="text"
               class="form-control"
               id="student_id"
               name="student_id"
               value="{{student_id}}"
               readonly>
    </div>
    <div class="form-group">
        <label for="new_pass">New Password</label>
        <input type="password"
               class="form-control"
               id="new_pass"
               name="new_pass"
               placeholder="Enter your new Password"
               required>
    </div>
    <div class="form-group">
        <label for="confirm_pass">Confirm Password</label>
        <input type="password"
               class="form-control"
               id="confirm_pass"
               name="confirm_pass"
               placeholder="Enter your Password"
               required>
    </div>
    <br />
        <button id="enter-button" type="submit" class="btn btn-primary">Enter</button>

</form>
{% endblock %}
